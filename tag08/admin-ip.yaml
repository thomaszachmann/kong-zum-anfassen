# admin-ip.yaml – Admin API nur von der VM selbst, nicht aus dem Netz (Tag 8)
# Die erlaubte Adresse steht nach dem ersten Versuch in der Fehlermeldung (Drill 5).
_format_version: "1.0"
add-plugins:
  - selectors:
      - $.services[?(@.name=="admin-api")]
    overwrite: true
    plugins:
      - name: ip-restriction
        config:
          allow: ["127.0.0.1"]
