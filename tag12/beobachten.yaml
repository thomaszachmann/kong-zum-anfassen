# beobachten.yaml – Metriken, JSON-Log und Traces für alle Anfragen (Tag 12)
_format_version: "1.0"
add-plugins:
  - plugins:
      - name: prometheus
        config:
          per_consumer: true
          status_code_metrics: true
          latency_metrics: true
          upstream_health_metrics: true
      - name: file-log
        config:
          path: /tmp/zugriff.json
      - name: opentelemetry
        config:
          traces_endpoint: http://jaeger:4318/v1/traces
          resource_attributes:
            service.name: kong
