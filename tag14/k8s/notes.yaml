# notes.yaml – notes-api (ohne Datenbank) und echo im Namespace notes (Tag 14)
apiVersion: v1
kind: Namespace
metadata:
  name: notes
---
apiVersion: v1
kind: Secret
metadata:
  name: notes-api
  namespace: notes
stringData:
  api-key: lab-api-key-123
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
  namespace: notes
spec:
  replicas: 2
  selector:
    matchLabels: {app: notes-api}
  template:
    metadata:
      labels: {app: notes-api}
    spec:
      containers:
        - name: notes-api
          image: notes-api:0.2.0
          imagePullPolicy: Never          # Image per ctr import (Drill 2)
          env:
            - name: NOTES_API_KEY
              valueFrom:
                secretKeyRef: {name: notes-api, key: api-key}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: notes-api
  namespace: notes
spec:
  selector: {app: notes-api}
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: notes
spec:
  selector:
    matchLabels: {app: echo}
  template:
    metadata:
      labels: {app: echo}
    spec:
      containers:
        - name: echo
          image: ghcr.io/mccutchen/go-httpbin:2.26.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: notes
spec:
  selector: {app: echo}
  ports:
    - port: 8080
