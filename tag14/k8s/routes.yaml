# routes.yaml – dieselben Pfade wie in Teil 1, jetzt als HTTPRoute (Tag 14)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: notes-lesen
  namespace: notes
spec:
  parentRefs:
    - {name: kong, namespace: kong}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api/v1/notes}
          method: GET
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /notes}
      backendRefs:
        - {name: notes-api, port: 8080}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: notes
spec:
  parentRefs:
    - {name: kong, namespace: kong}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /echo}
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /}
      backendRefs:
        - {name: echo, port: 8080}
