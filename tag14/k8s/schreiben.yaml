# schreiben.yaml – Schreiben nur mit Schlüssel, Backend-Schlüssel setzt das Gateway (Tag 14)
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: key-auth
  namespace: notes
plugin: key-auth
config:
  hide_credentials: true
---
apiVersion: v1
kind: Secret
metadata:
  name: anna-key
  namespace: notes
  labels:
    konghq.com/credential: key-auth
stringData:
  key: lab-key-anna-456
---
apiVersion: configuration.konghq.com/v1
kind: KongConsumer
metadata:
  name: anna
  namespace: notes
  annotations:
    kubernetes.io/ingress.class: kong
username: anna
credentials:
  - anna-key
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: notes-schreiben
  namespace: notes
  annotations:
    konghq.com/plugins: key-auth
spec:
  parentRefs:
    - {name: kong, namespace: kong}
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api/v1/notes}
          method: POST
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplacePrefixMatch, replacePrefixMatch: /notes}
        - type: RequestHeaderModifier       # Backend-Schlüssel setzt das Gateway
          requestHeaderModifier:
            set:
              - {name: X-API-Key, value: lab-api-key-123}
      backendRefs:
        - {name: notes-api, port: 8080}
