# global.yaml – Plugins für alle Anfragen (Tag 4)
_format_version: "1.0"
add-plugins:
  - plugins:
      - name: correlation-id
        config:
          header_name: X-Correlation-ID
          generator: uuid
          echo_downstream: true
      - name: request-transformer
        config:
          add:
            headers: ["X-Ebene:global"]
