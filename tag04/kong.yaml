# kong.yaml – Stand Ende Tag 4 (von decK geschrieben)
_format_version: "3.0"
plugins:
- config:
    echo_downstream: true
    generator: uuid
    header_name: X-Correlation-ID
  name: correlation-id
services:
- name: echo
  routes:
  - name: echo
    paths:
    - /echo
  - hosts:
    - echo.lab
    name: echo-host
    preserve_host: true
  url: http://echo:8080
- connect_timeout: 2000
  name: notes
  plugins:
  - config:
      headers:
      - Content-Type
      - X-API-Key
      max_age: 600
      methods:
      - GET
      - POST
      origins:
      - http://localhost:3000
    name: cors
  read_timeout: 10000
  routes:
  - methods:
    - GET
    - OPTIONS
    name: notes-lesen
    paths:
    - /api/v1/notes
  - methods:
    - POST
    name: notes-schreiben
    paths:
    - /api/v1/notes
  tags:
  - team-notes
  url: http://notes-api:8080/notes
- connect_timeout: 2000
  name: notes-version
  read_timeout: 10000
  routes:
  - methods:
    - GET
    name: notes-version
    paths:
    - /api/v1/version
  tags:
  - team-notes
  url: http://notes-api:8080/version
- name: api-rest
  routes:
  - name: api-rest
    paths:
    - /api
  url: http://echo:8080/anything
